# Netlify Configuration for Second Mountain Internal Medicine

# Build settings
[build]
  publish = "."
  command = "echo 'No build required - static site'"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Cache control for static assets
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect rules
# Canonical URLs are extensionless (clean URLs). Netlify serves /services from
# services.html automatically. These rules 301 the old .html URLs to the clean
# version so there is exactly one indexable URL per page. force = true is required
# because the .html file exists, and file matches otherwise shadow the redirect.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/service-area.html"
  to = "/service-area"
  status = 301
  force = true

[[redirects]]
  from = "/referrals.html"
  to = "/referrals"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

# 404 redirect to home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Custom 404 page (optional - create 404.html if desired)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404
